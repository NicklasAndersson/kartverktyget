<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>kvg render page</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
    <script src="https://unpkg.com/pmtiles@4.1.0/dist/pmtiles.js"></script>
    <style>
      html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);
      const demSource = new mlcontour.DemSource({
        url: 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',
        encoding: 'terrarium',
        maxzoom: 13,
        worker: true,
      });
      demSource.setupMaplibre(maplibregl);
      const CONTOUR_URL = demSource.contourProtocolUrl({
        thresholds: {
          11: [50, 200],
          12: [25, 100],
          13: [10, 50],
          14: [5, 20],
        },
        multiplier: 1,
        overzoom: 1,
      });

      function addContourLayers(map) {
        if (map.getSource('kvg-contours')) return;
        map.addSource('kvg-contours', {
          type: 'vector',
          tiles: [CONTOUR_URL],
          minzoom: 1,
          maxzoom: 14,
        });
        map.addLayer({
          id: 'kvg-contour-minor',
          type: 'line',
          source: 'kvg-contours',
          'source-layer': 'contours',
          filter: ['!=', ['get', 'level'], 1],
          paint: {
            'line-color': '#c47533',
            'line-width': 0.6,
            'line-opacity': 0.7,
          },
        });
        map.addLayer({
          id: 'kvg-contour-major',
          type: 'line',
          source: 'kvg-contours',
          'source-layer': 'contours',
          filter: ['==', ['get', 'level'], 1],
          paint: {
            'line-color': '#a0522d',
            'line-width': 1.2,
            'line-opacity': 0.9,
          },
        });
      }

      function findWaterSourceId(map) {
        const layers = map.getStyle().layers || [];
        for (const layer of layers) {
          if (layer['source-layer'] !== 'water' || typeof layer.source !== 'string') continue;
          return layer.source;
        }
        return null;
      }

      function addWatercourseLayer(map) {
        if (map.getLayer('kvg-watercourses')) return;
        const sourceId = findWaterSourceId(map);
        if (!sourceId) return;
        map.addLayer({
          id: 'kvg-watercourses',
          type: 'line',
          source: sourceId,
          'source-layer': 'water',
          filter: [
            'all',
            ['==', ['geometry-type'], 'LineString'],
            ['match', ['get', 'kind'], ['river', 'stream', 'canal'], true, false],
          ],
          paint: {
            'line-color': '#2f86c6',
            'line-width': ['interpolate', ['linear'], ['zoom'], 7, 0.6, 10, 1.1, 13, 2, 15, 3],
            'line-opacity': 0.95,
          },
        });
      }

      // Ikoner måste vara inlästa innan symbol-lagret ritas, annars hoppar
      // MapLibre över dem och PDF:en får tomma punkter.
      // Emojin ritas på en canvas; äldre sparade ikoner har namn istället för emoji.
      const LEGACY_ICONS = { tent: '⛺', fire: '🔥', water: '💧', parking: '🅿️', warning: '⚠️' };
      function loadIcons(map, waypoints, pxScale) {
        const size = Math.ceil(32 * Math.max(2, pxScale));
        for (const f of waypoints?.features ?? []) {
          const name = f?.properties?.icon;
          if (typeof name !== 'string' || map.hasImage(name)) continue;
          const ctx = document.createElement('canvas').getContext('2d');
          ctx.canvas.width = ctx.canvas.height = size;
          ctx.font = `${size * 0.8}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(LEGACY_ICONS[name] ?? name, size / 2, size / 2 + size * 0.05);
          map.addImage(name, ctx.getImageData(0, 0, size, size), { pixelRatio: size / 32 });
        }
      }

      // Chevron som pekar i linjens riktning; SDF så att icon-color färgar den.
      function arrowImage(size) {
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.canvas.width = ctx.canvas.height = size;
        ctx.lineWidth = size * 0.2;
        ctx.lineCap = ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(size * 0.3, size * 0.2);
        ctx.lineTo(size * 0.7, size * 0.5);
        ctx.lineTo(size * 0.3, size * 0.8);
        ctx.stroke();
        return ctx.getImageData(0, 0, size, size);
      }

      window.kvgRender = async function (args) {
        const { style, bounds, widthPx, heightPx, overlays, watercourses = true, contours, trackColor = '#c0392b', trackWidth = 2.5, trackArrows = false, pxScale = 1 } = args;
        document.body.style.width = widthPx + 'px';
        document.body.style.height = heightPx + 'px';
        const el = document.getElementById('map');
        el.style.width = widthPx + 'px';
        el.style.height = heightPx + 'px';

        const map = new maplibregl.Map({
          container: 'map',
          style: style,           // inline style JSON-objekt med absoluta tile-URLs
          attributionControl: false,
          fadeDuration: 0,
          preserveDrawingBuffer: true,
        });
        await new Promise((res) => map.once('load', res));

        if (contours) {
          addContourLayers(map);
        }
        if (watercourses) {
          addWatercourseLayer(map);
        }

        // Overlays. Alla mått multipliceras med pxScale eftersom render-ytan
        // är 300 DPI – annars blir spår och punkter hårfina på papper.
        if (overlays?.tracks?.features?.length) {
          map.addSource('kvg-tracks', { type: 'geojson', data: overlays.tracks });
          map.addLayer({
            id: 'kvg-tracks-line',
            type: 'line',
            source: 'kvg-tracks',
            paint: { 'line-color': trackColor, 'line-width': trackWidth * pxScale },
          });
          if (trackArrows) {
            const size = Math.ceil(32 * Math.max(2, pxScale));
            map.addImage('kvg-arrow', arrowImage(size), { pixelRatio: size / 16, sdf: true });
            map.addLayer({
              id: 'kvg-tracks-arrows',
              type: 'symbol',
              source: 'kvg-tracks',
              layout: {
                'symbol-placement': 'line',
                'symbol-spacing': 80 * pxScale,
                'icon-image': 'kvg-arrow',
                'icon-size': (trackWidth / 4) * pxScale,
                'icon-allow-overlap': true,
              },
              paint: { 'icon-color': trackColor },
            });
          }
        }
        if (overlays?.waypoints?.features?.length) {
          loadIcons(map, overlays.waypoints, pxScale);
          map.addSource('kvg-waypoints', { type: 'geojson', data: overlays.waypoints });
          map.addLayer({
            id: 'kvg-waypoints-circle',
            type: 'circle',
            source: 'kvg-waypoints',
            filter: ['!', ['has', 'icon']],
            paint: {
              'circle-radius': 5 * pxScale,
              'circle-color': '#c0392b',
              'circle-stroke-color': '#fff',
              'circle-stroke-width': 1.5 * pxScale,
            },
          });
          map.addLayer({
            id: 'kvg-waypoints-icon',
            type: 'symbol',
            source: 'kvg-waypoints',
            filter: ['has', 'icon'],
            layout: {
              'icon-image': ['get', 'icon'],
              'icon-size': 0.6 * pxScale,
              'icon-allow-overlap': true,
            },
          });
        }

        map.fitBounds(
          [
            [bounds.west, bounds.south],
            [bounds.east, bounds.north],
          ],
          { animate: false, padding: 0, duration: 0 },
        );

        // Vänta på idle (alla tiles laddade för det nya viewport:et).
        // Använd INTE areTilesLoaded() direkt efter fitBounds – tile-requests
        // dispatches asynkront och metoden kan returnera true för gamla tiles.
        await Promise.race([
          new Promise((res) => map.once('idle', res)),
          new Promise((res) => setTimeout(res, 30000)),
        ]);
      };
    </script>
  </body>
</html>
